name: Check

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (Dart ${{ matrix.dart-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dart-version: ["3.11.5", "3.14.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}

      - name: Install dependencies (locked)
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  real-fs:
    name: Real-FS (${{ matrix.os }} / Dart 3.12.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Install dependencies (locked)
        run: dart pub get --enforce-lockfile

      - name: Real-filesystem tests
        run: dart test test/flutter_workspaces_cli_real_fs_test.dart --reporter expanded

  smoke:
    name: Smoke (${{ matrix.os }} / Flutter ${{ matrix.flutter-version }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            flutter-version: "3.44.0"
          - os: windows-latest
            shell: pwsh
            flutter-version: "3.44.0"
          - os: ubuntu-latest
            shell: bash
            flutter-version: "3.50.1"
          - os: windows-latest
            shell: pwsh
            flutter-version: "3.50.1"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable

      - name: Resolve CLI dependencies
        run: dart pub get --enforce-lockfile

      - name: Create smoke temp directory
        run: mkdir "${{ runner.temp }}/scaffold-smoke"

      - name: Scaffold workspace (CLI setup)
        working-directory: ${{ runner.temp }}/scaffold-smoke
        run: dart run "${{ github.workspace }}/bin/flutter_workspaces_cli.dart" setup --name scaffold_smoke

      - name: Resolve dependencies (generated workspace)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces
        run: flutter pub get

      - name: Analyze (generated workspace)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces
        run: flutter analyze

      - name: Test (generated app)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces/scaffold_smoke
        run: flutter test

      - name: Test (core package)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces/packages/core
        run: flutter test

      - name: Add package (CLI add-package)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces
        run: dart run "${{ github.workspace }}/bin/flutter_workspaces_cli.dart" add-package --name smoke_feature

      - name: Resolve dependencies (after add-package)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces
        run: flutter pub get

      - name: Test (smoke_feature package)
        working-directory: ${{ runner.temp }}/scaffold-smoke/scaffold_smoke_workspaces/packages/smoke_feature
        run: flutter test
